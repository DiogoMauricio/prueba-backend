<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinEdu-Bot</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1b2230; --muted: #5d6677;
    --border: #dde1e7; --accent: #1f5fbf; --accent-text: #ffffff;
    --user: #e8f0fd; --error: #b3261e; --error-bg: #fdecea; --warn-bg: #fff6e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 16px; }
  header .wrap { max-width: 820px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px; }
  #chat .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; padding: 12px 14px; border-radius: 10px; line-height: 1.5;
         white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.err { background: var(--error-bg); border-color: #f2c4c0; color: var(--error); }
  .msg.warn { background: var(--warn-bg); border-color: #f0dca8; }
  .meta { margin-top: 8px; font-size: .78rem; color: var(--muted); white-space: normal; }
  .table-wrap { overflow-x: auto; margin-top: 10px; white-space: normal; }
  table { border-collapse: collapse; font-size: .85rem; min-width: 100%; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #f0f2f5; font-weight: 600; }
  .typing { color: var(--muted); font-style: italic; }
  .empty { text-align: center; color: var(--muted); margin-top: 40px; }
  .ejemplos { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .ejemplos button { background: var(--panel); border: 1px solid var(--border); color: var(--text);
                     border-radius: 16px; padding: 6px 12px; font-size: .85rem; cursor: pointer; }
  form { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px; }
  form .wrap { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; padding: 10px 12px;
             border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  button.send { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
                padding: 0 18px; font-size: .95rem; cursor: pointer; }
  button.send:disabled { opacity: .55; cursor: wait; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>FinEdu-Bot</h1>
    <p>Consultas sobre el presupuesto público del Perú (datos MEF)</p>
  </div>
</header>

<main id="chat">
  <div class="wrap" id="mensajes">
    <div class="empty" id="vacio">
      Escribe una pregunta sobre presupuesto de una entidad pública.
      <div class="ejemplos">
        <button type="button">¿Cuál fue el PIM de la Municipalidad de Miraflores en 2021?</button>
        <button type="button">Evolución del devengado del Gobierno Regional de Cusco 2017-2021</button>
      </div>
    </div>
  </div>
</main>

<form id="form">
  <div class="wrap">
    <textarea id="pregunta" rows="1" placeholder="Escribe tu consulta…" required></textarea>
    <button class="send" id="enviar" type="submit">Enviar</button>
  </div>
</form>

<script src="config.js"></script>
<script>
  const CFG = window.FINEDU_CONFIG || {};
  const $mensajes = document.getElementById("mensajes");
  const $form = document.getElementById("form");
  const $pregunta = document.getElementById("pregunta");
  const $enviar = document.getElementById("enviar");

  // Id de sesión para que el bot recuerde el contexto de la conversación
  function obtenerSesion() {
    let id = null;
    try { id = sessionStorage.getItem("finedu_session"); } catch (e) {}
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
      try { sessionStorage.setItem("finedu_session", id); } catch (e) {}
    }
    return id;
  }
  const SESSION_ID = obtenerSesion();

  const fmt = new Intl.NumberFormat("es-PE", { maximumFractionDigits: 0 });
  const COLS = [
    ["anio", "Año"], ["pia", "PIA"], ["pim", "PIM"], ["certificado", "Certificado"],
    ["comprometido", "Comprometido"], ["devengado", "Devengado"], ["girado", "Girado"]
  ];

  function agregar(clase, texto) {
    document.getElementById("vacio")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + clase;
    div.textContent = texto;
    $mensajes.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function tablaEvolucion(filas) {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    const t = document.createElement("table");
    const entidad = filas[0]?.entidad;
    const thead = "<tr>" + COLS.map(c => `<th>${c[1]}</th>`).join("") + "</tr>";
    t.innerHTML = `<thead>${thead}</thead><tbody></tbody>`;
    const tb = t.querySelector("tbody");
    filas.forEach(f => {
      const tr = document.createElement("tr");
      COLS.forEach(([k]) => {
        const td = document.createElement("td");
        const v = f[k];
        td.textContent = k === "anio" ? (v ?? "") : (typeof v === "number" ? fmt.format(v) : (v ?? "—"));
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    if (entidad) {
      const cap = document.createElement("div");
      cap.className = "meta";
      cap.textContent = "Entidad: " + entidad + " · montos en soles";
      wrap.appendChild(cap);
    }
    wrap.appendChild(t);
    return wrap;
  }

  function mostrarRespuesta(div, data) {
    div.classList.remove("typing");
    if (data.success === false) div.classList.add("err");
    div.textContent = data.output || data.message || "(sin respuesta)";

    if (Array.isArray(data.evolucion) && data.evolucion.length) {
      div.appendChild(tablaEvolucion(data.evolucion));
    }
    const meta = document.createElement("div");
    meta.className = "meta";
    const partes = [];
    if (data.proveedor_respuesta) partes.push("Respondió: " + data.proveedor_respuesta);
    if (data.correlation_id) partes.push("ID: " + data.correlation_id);
    meta.textContent = partes.join(" · ");
    if (partes.length) div.appendChild(meta);
  }

  async function consultar(pregunta) {
    agregar("user", pregunta);
    const div = agregar("bot typing", "Consultando…");
    $enviar.disabled = true;

    try {
      const res = await fetch(CFG.WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chatInput: pregunta, sessionId: SESSION_ID }),
        signal: AbortSignal.timeout(CFG.TIMEOUT_MS || 90000)
      });
      const texto = await res.text();
      let data = null;
      try { data = JSON.parse(texto); } catch (e) {}

      if (!res.ok) {
        div.className = "msg bot err";
        div.textContent = `El servidor respondió con error (HTTP ${res.status}). Intenta nuevamente.`;
      } else if (data && typeof data === "object") {
        mostrarRespuesta(div, Array.isArray(data) ? data[0] : data);
      } else {
        // Rama high_risk del Security Filter: responde texto plano
        div.className = "msg bot warn";
        div.textContent = texto || "(respuesta vacía)";
      }
    } catch (e) {
      div.className = "msg bot err";
      div.textContent = e.name === "TimeoutError" || e.name === "AbortError"
        ? "La consulta tardó demasiado. Intenta nuevamente en unos segundos."
        : "No se pudo conectar con el servidor. Revisa tu conexión o que el servicio esté activo.";
    } finally {
      $enviar.disabled = false;
      $pregunta.focus();
    }
  }

  $form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = $pregunta.value.trim();
    if (!q || $enviar.disabled) return;
    $pregunta.value = "";
    consultar(q);
  });

  $pregunta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $form.requestSubmit(); }
  });

  document.querySelectorAll(".ejemplos button").forEach(b =>
    b.addEventListener("click", () => consultar(b.textContent)));
</script>
</body>
</html>
