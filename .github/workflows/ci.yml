name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:   # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read

jobs:
  validar-flujos:
    name: Validar JSON de flujos n8n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cada flujo es JSON válido de n8n
        run: |
          shopt -s nullglob
          archivos=(backend/n8n/workflows/*.json)
          [ ${#archivos[@]} -gt 0 ] || { echo "No hay flujos"; exit 0; }
          for f in "${archivos[@]}"; do
            jq -e '.nodes and .connections' "$f" > /dev/null \
              && echo "OK    $f" || { echo "ERROR $f"; exit 1; }
          done

      - name: Los flujos no traen claves escritas
        run: |
          if grep -rEn '(sk-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|postgres(ql)?://[^:"]+:[^@"]+@)' backend frontend; then
            echo "Se encontró algo que parece una clave o contraseña. Quítalo y usa credenciales de n8n."
            exit 1
          fi
          echo "Sin claves expuestas"

  prueba-bot:
    name: Prueba del flujo del bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Consulta real al n8n en la nube
        env:
          BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
        run: node --test tests/bot.test.mjs
